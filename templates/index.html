<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Search Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .results-table th, .results-table td {
            text-align: center;
        }
        .alert {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">PDF Search Application</h1>
        
        <!-- Upload Form -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Upload PDF ZIP File</h5>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" class="form-control" id="fileInput" name="file" accept=".zip" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
                <div id="uploadStatus"></div>
            </div>
        </div>

        <!-- Search Form -->
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Search by Name</h5>
                <div class="mb-3">
                    <input type="text" class="form-control" id="searchInput" placeholder="Enter name to search">
                </div>
                <button class="btn btn-secondary" id="searchButton">Search</button>
            </div>
        </div>

        <!-- Search Results -->
        <div class="card mt-4" id="resultsCard" style="display:none;">
            <div class="card-body">
                <h5 class="card-title">Search Results</h5>
                <table class="table table-bordered results-table">
                    <thead>
                        <tr>
                            <th>Matricule</th>
                            <th>Name</th>
                            <th>Days Worked</th>
                            <th>Salary</th>
                            <th>File</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <!-- Results will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Error or Success Message -->
        <div id="errorMessage" class="alert alert-danger" style="display:none;"></div>
        <div id="successMessage" class="alert alert-success" style="display:none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Handle the form submission for file upload
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const fileInput = document.getElementById('fileInput');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const uploadStatus = document.getElementById('uploadStatus');
            uploadStatus.innerHTML = '<div class="alert alert-info">Uploading...</div>';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    uploadStatus.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                } else {
                    uploadStatus.innerHTML = '<div class="alert alert-danger">Upload failed. Please try again.</div>';
                }
            })
            .catch(error => {
                uploadStatus.innerHTML = '<div class="alert alert-danger">Upload failed. Please try again.</div>';
                console.error(error);
            });
        });

        // Handle search functionality
        document.getElementById('searchButton').addEventListener('click', function() {
            const name = document.getElementById('searchInput').value.trim();
            if (!name) {
                document.getElementById('errorMessage').innerText = 'Please enter a name to search.';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            document.getElementById('errorMessage').style.display = 'none';

            fetch(`/search?name=${encodeURIComponent(name)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        document.getElementById('resultsCard').style.display = 'block';
                        const resultsTableBody = document.getElementById('resultsTableBody');
                        resultsTableBody.innerHTML = ''; // Clear previous results
                        data.results.forEach(result => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${result.matricule}</td>
                                <td>${result.name}</td>
                                <td>${result.days}</td>
                                <td>${result.salary}</td>
                                <td>${result.file}</td>
                            `;
                            resultsTableBody.appendChild(row);
                        });
                    } else {
                        document.getElementById('resultsCard').style.display = 'none';
                        document.getElementById('errorMessage').innerText = 'No results found.';
                        document.getElementById('errorMessage').style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('errorMessage').innerText = 'An error occurred. Please try again.';
                    document.getElementById('errorMessage').style.display = 'block';
                });
        });
    </script>
</body>
</html>
